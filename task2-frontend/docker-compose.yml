services:
  mock-api:
    image: meetrj/callzo-mock-usage-api
    platform: linux/arm64
    container_name: mock-api
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    image: sajjannnn/callzo-task2-frontend
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      mock-api:
        condition: service_healthy
    environment:
      MOCK_API_URL: http://mock-api:8001
